spring:
  application:
    name: order-service
  datasource:
    url: jdbc:postgresql://localhost:5434/order-db
    username: order-user
    password: order-password
  jpa:
    hibernate:
      ddl-auto: create-drop
    defer-datasource-initialization: true
    show-sql: true
    properties:
      hibernate:
        format_sql: true
#  sql:
#    init:
#      mode: always
#      data-locations: classpath:data.sql

server:
  servlet:
    context-path: /api/v1
  port: 9020


eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka


resilience4j:
  retry:
    instances:
      inventoryRetry:
        max-attempts: 3
        wait-duration:
          seconds: 5
  ratelimiter:
    instances:
      inventoryRateLimiter:
        limit-for-period: 1
        limit-refresh-period: 5s
        timeout-duration: 1s