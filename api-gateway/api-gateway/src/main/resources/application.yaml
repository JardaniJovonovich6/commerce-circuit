spring:
  application:
    name: api-gateway

#Api gateway config
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: order-service
              uri: lb://ORDER-SERVICE
              predicates:
                - Path=/api/v1/orders/**
            - id: inventory-service
              uri: lb://INVENTORY-SERVICE
              predicates:
                - Path=/api/v1/products/**
#        - id: no-service
#          uri: lb://NO-SERVICE
#          predicates:
#            - Path=/api/v1/no-service/**
#          filters:
#            - AddRequestHeader=X-Custom-Header, Anuj
#            - RedirectTo=302, https://codingshuttle.com





eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

server:
  port: 8080
